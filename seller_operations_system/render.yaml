services:
  # Web Application Service
  - type: web
    name: seller-operations-platform
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt && python database/init_db.py --seed"
    startCommand: "gunicorn -c gunicorn.conf.py wsgi:app"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: seller-ops-db
          property: connectionString
      - key: WORKERS
        value: "2"
      - key: LOG_LEVEL
        value: info

# Managed Relational Database
databases:
  - name: seller-ops-db
    region: oregon
    plan: starter
    databaseName: seller_ops_db
    user: seller_ops_user

